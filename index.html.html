<script>
const P = PORTFOLIO;
const e = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col = i => `style="--c:var(--${["p","a","s","m"][i % 4]})"`;
const root = document.documentElement.style;
root.setProperty("--p", P.couleurs.principale);
root.setProperty("--a", P.couleurs.accent);
root.setProperty("--s", P.couleurs.soleil);
root.setProperty("--m", P.couleurs.menthe);
document.title = `${P.nom} | Portfolio BTS SIO`;

const R = {
  accueil() {
    const ini = (P.surnom || P.nom).split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
    const av = P.photo ? `<img src="${e(P.photo)}" alt="Photo de ${e(P.nom)}">` : e(ini);
    return `<div class="wrap hero-g"><div>
      <p class="hi">Salut, moi c'est ${e(P.surnom)}.</p>
      <h1>${e(P.nom)}</h1>
      <p class="lead">${e(P.titre)}. ${e(P.accroche)}</p>
      <div class="btns"><a class="btn pri" href="#projets">Voir mes projets</a><a class="btn" href="#contact">Me contacter</a></div>
    </div><div class="visual" aria-hidden="true"><i class="sh s1"></i><i class="sh s2"></i><i class="sh s3"></i><div class="avatar">${av}</div></div></div>`;
  },
  apropos() {
    const a = P.apropos;
    return `<div class="wrap"><h2>À propos</h2><div class="about"><div>${a.textes.map(t => `<p>${e(t)}</p>`).join("")}</div>
      <div class="info">${a.infos.map((x, i) => `<div ${col(i)}><b>${e(x.label)}</b>${e(x.valeur)}</div>`).join("")}</div></div></div>`;
  },
  parcours() {
    return `<div class="wrap"><h2>Mon parcours</h2><div class="tl">${P.parcours.map((x, i) =>
      `<div class="ti" ${col(i)}><h3>${e(x.titre)}</h3><p class="meta">${e(x.periode)}</p><p style="margin:0;max-width:60ch">${e(x.texte)}</p></div>`).join("")}</div></div>`;
  },
  ecole() {
    const s = P.ecole, poles = s.poles || [];
    return `<div class="wrap"><h2>${e(s.titre)}</h2><p style="max-width:60ch;margin:32px 0 0">${e(s.texte)}</p>
      <div class="grid">${s.chiffres.map((c, i) => `<div class="card" ${col(i)}><span class="big" ${col(i)}>${e(c.valeur)}</span><p style="margin:0">${e(c.label)}</p></div>`).join("")}</div>
      ${s.histoire ? `<h3 style="margin-top:44px">${e(s.histoire.titre)}</h3><p style="max-width:60ch;margin:14px 0 0">${e(s.histoire.texte)}</p>
      <div class="grid" style="margin-top:20px">${(s.histoire.reperes || []).map((r, i) => `<div class="card" ${col(i)}><span class="big" ${col(i)}>${e(r.date)}</span><p style="margin:0">${e(r.texte)}</p></div>`).join("")}</div>
      ${s.histoire.note ? `<p class="meta" style="margin:18px 0 0;max-width:70ch">${e(s.histoire.note)}</p>` : ""}` : ""}
      ${poles.length ? `<h3 style="margin-top:44px">Pôles de formation</h3><div style="margin-top:14px">${poles.map((p, i) => `<span class="tag" ${col(i)}>${e(p)}</span>`).join("")}</div>` : ""}</div>`;
  },
  competences() {
    return `<div class="wrap"><h2>Compétences</h2><div class="grid">${P.competences.map((g, i) =>

  },
  projets() {
    return `<div class="wrap"><h2>Projets et réalisations</h2><div class="grid">${P.projets.map((p, i) =>
      `<article class="card" ${col(i)}><h3>${e(p.titre)}</h3><p class="meta">${e(p.contexte)}</p><p>${e(p.description)}</p>
      <div>${(p.outils || []).map(t => `<span class="tag">${e(t)}</span>`).join("")}</div>
      ${p.lien ? `<p style="margin:10px 0 0"><a href="${e(p.lien)}" target="_blank" rel="noopener"><b>Voir le projet</b></a></p>` : ""}</article>`).join("")}</div></div>`;
  },
  experiences() {
    return `<div class="wrap"><h2>Stages et alternance</h2><div class="tl">${P.experiences.map((x, i) =>
      `<div class="ti" ${col(i)}><h3>${e(x.poste)}</h3><p class="meta">${e(x.lieu)}, ${e(x.periode)}</p><p style="margin:0;max-width:60ch">${e(x.description)}</p></div>`).join("")}</div></div>`;
  },
  entreprise() {
    const s = P.entreprise, d = s.dsi || {}, infos = (s.infos || []).filter(x => x.valeur);
    return `<div class="wrap"><h2>${e(s.titre)}</h2><p style="max-width:60ch;margin:32px 0 0">${e(s.texte)}</p>
      ${infos.length ? `<div class="info" style="margin-top:32px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))">${infos.map((x, i) => `<div ${col(i)}><b>${e(x.label)}</b>${e(x.valeur)}</div>`).join("")}</div>` : ""}
      ${(s.chiffres || []).length ? `<h3 style="margin-top:44px">${e(s.chiffresTitre || "En chiffres")}</h3>
      <div class="grid" style="margin-top:20px">${s.chiffres.map((c, i) => `<div class="card" ${col(i)}><span class="big" ${col(i)}>${e(c.valeur)}</span><p style="margin:0">${e(c.label)}</p></div>`).join("")}</div>
      ${s.chiffresNote ? `<p class="meta" style="margin:18px 0 0;max-width:70ch">${e(s.chiffresNote)}</p>` : ""}` : ""}
      <div class="veille"><h3>${e(d.titre)}</h3><p style="margin:0;max-width:60ch">${e(d.texte)}</p></div>
      <div class="grid">${(d.missions || []).map((m, i) => `<div class="card" ${col(i)}><h3>${e(m.titre)}</h3><p style="margin:10px 0 0">${e(m.texte)}</p></div>`).join("")}</div>
      ${s.monRole ? `<div class="card" style="--c:var(--a);margin-top:40px"><h3>Mon rôle</h3><p style="margin:10px 0 0">${e(s.monRole)}</p></div>` : ""}</div>`;
  },
  veille() {
    const v = P.veille;
    return `<div class="wrap"><h2>Veille technologique</h2><div class="veille"><h3>${e(v.sujet)}</h3><p style="margin:0;max-width:60ch">${e(v.description)}</p>
      <ul>${(v.sources || []).map(s => `<li><a href="${e(s.lien)}" target="_blank" rel="noopener">${e(s.nom)}</a></li>`).join("")}</ul></div></div>`;
  },
  contact() {
    const c = P.contact, b = [];
    if (c.cv) b.push(`<a class="btn sun" href="${e(c.cv)}" download>Télécharger mon CV</a>`);
    if (c.email) b.push(`<a class="btn" href="mailto:${e(c.email)}">${e(c.email)}</a>`);
    if (c.telephone) b.push(`<a class="btn" href="tel:${e(c.telephone.replace(/\s/g, ""))}">${e(c.telephone)}</a>`);
    if (c.linkedin) b.push(`<a class="btn" href="${e(c.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`);
    if (c.github) b.push(`<a class="btn" href="${e(c.github)}" target="_blank" rel="noopener">GitHub</a>`);
    return `<div class="wrap"><h2>CV et contact</h2><div class="contact"><p>${e(c.texte)}</p><div class="btns">${b.join("")}</div></div></div>`;
  }
};

document.getElementById("nav").innerHTML = P.sections.map(s => `<a href="#${e(s.id)}">${e(s.label)}</a>`).join("");
document.getElementById("main").innerHTML = P.sections.filter(s => R[s.id]).map(s =>
  `<section id="${e(s.id)}"${s.id === "accueil" ? ' class="hero"' : ""}>${R[s.id]()}</section>`).join("");
document.getElementById("foot").textContent = `© ${new Date().getFullYear()} ${P.nom}. Portfolio BTS SIO.`;

const links = [...document.querySelectorAll("nav a")];
const io = new IntersectionObserver(es => es.forEach(x => {
  if (x.isIntersecting) links.forEach(l => l.classList.toggle("on", l.getAttribute("href") === "#" + x.target.id));
}), { rootMargin: "-40% 0px -55% 0px" });
document.querySelectorAll("main section").forEach(s => io.observe(s));
</script>
</body>
</html>
